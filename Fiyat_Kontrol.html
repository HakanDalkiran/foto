// Kullanicinin bu oturumda yaptigi elleme degisiklikleri (barkod -> 0/1).
// localStorage'da saklanir; Kaydet'e basilana kadar kaybolmaz.
let kilit=JSON.parse(localStorage.getItem('fk_elleme')||'{}');
function kaydetYerel(){localStorage.setItem('fk_elleme',JSON.stringify(kilit))}
function kf(u){return (u.b in kilit)?!!kilit[u.b]:!!u.e}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function satir(u){
  let kor = u.o ? '<span class="roz kor">🔒 oto (fiyat elle)</span>' : '';
  let kay = u.ks!=null ? `<span class="roz kay">kaynak: ${u.ks} adet / ${u.ka} TL</span>` : '';
  let miad = u.miad ? `<span class="roz miad">${esc(u.miad)}</span>` : '';
  let f = u.f.map((v,i)=>`<div class="fi"><span>${KI[i]}</span><b>${v==null?'-':v}</b></div>`).join('');
  return `<div class="u ${u.d?'dg':''} ${(kf(u)||u.o)?'korumali':''} ${kf(u)?'kilitli':''}" data-ad="${esc((u.ad+' '+u.b).toLowerCase())}" data-s=${u.stok} data-k="${(kf(u)||u.o)?1:''}" data-d=${u.d} data-b="${esc(u.b)}">
   <div class=info><div class=ad>${esc(u.ad)}</div>
   <div class=alt>${esc(u.b)} <span class="roz ${u.stok?'':'yok'}">${u.stok?u.stok+' adet':'stok yok'}</span>${miad}${kay}${kor}</div></div>
   <div class=fx>${f}</div>
   <label class=kl title="İşaretli ürün toplu güncellemeden korunur; stoğu bitince koruma kalkar."><input type=checkbox ${kf(u)?'checked':''} onchange='kilitle(${JSON.stringify(u.b)},this.checked)'>🔒 elleme</label></div>`}
function kilitle(b,ac){
  let u=D.find(x=>x.b==b); if(!u)return;
  if(!!ac===!!u.e) delete kilit[b]; else kilit[b]=ac?1:0;
  kaydetYerel();
  let el=document.querySelector('.u[data-b="'+CSS.escape(b)+'"]');
  if(el){el.classList.toggle('kilitli',!!ac);el.classList.toggle('korumali',!!ac||!!u.o);el.dataset.k=(ac||u.o)?1:''}
  sayim()}
function uygun(k,q,g,kr,d){return k.dataset.ad.includes(q)&&(!g||+k.dataset.s>0)&&(!kr||k.dataset.k)&&(!d||k.dataset.d=='1')}
function render(){
  const L=document.getElementById('liste');L.innerHTML='';let i=0;
  (function blok(){
    const q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('s0').checked,
          kr=document.getElementById('sk').checked,d=document.getElementById('sd').checked;
    const bas=L.children.length;let h='';
    for(let n=0;n<200&&i<D.length;n++,i++)h+=satir(D[i]);
    L.insertAdjacentHTML('beforeend',h);
    for(let j=bas;j<L.children.length;j++){const k=L.children[j];if(!uygun(k,q,g,kr,d))k.style.display='none'}
    if(i<D.length)setTimeout(blok,0);else sayim()})()}
function filtrele(){const q=document.getElementById('q').value.toLowerCase(),g=document.getElementById('s0').checked,
  kr=document.getElementById('sk').checked,d=document.getElementById('sd').checked;
  document.querySelectorAll('.u').forEach(k=>{k.style.display=uygun(k,q,g,kr,d)?'':'none'});sayim()}
function sayim(){const t=document.querySelectorAll('.u').length,
  g=[...document.querySelectorAll('.u')].filter(k=>k.style.display!=='none').length;
  document.getElementById('ozet').textContent=g+' / '+t+' ürün';
  let ek=D.filter(u=>kf(u)&&!u.e).length, ck=D.filter(u=>!kf(u)&&u.e).length;
  document.getElementById('degsay').textContent=(ek||ck)?('Kaydedilmemiş: '+(ek?'+'+ek+' elleme ':'')+(ck?'-'+ck+' elleme':'')):''}
// ---- BULUTA GONDER (Google Form) ----
// KURAL: buluta SADECE elleme_ekle/elleme_cikar gider. Sayfadaki fiyat/stok
// degerleri hicbir yere yazilmaz — kaynak her zaman tedarikci verisidir.
const FORM_URL="https://docs.google.com/forms/d/e/1FAIpQLSfvXvdqx-n_aq0AJMi20O2sEg2AfvbHYf1gpL7-IIiqkQzR8w/formResponse", FORM_ENTRY="entry.975569953";
function paket(){
  let ekle=D.filter(u=>kf(u)&&!u.e).map(u=>u.b);
  let cikar=D.filter(u=>!kf(u)&&u.e).map(u=>u.b);
  if(!ekle.length&&!cikar.length)return null;
  let o={tarih:new Date().toISOString()};
  if(ekle.length)o.elleme_ekle=ekle;
  if(cikar.length)o.elleme_cikar=cikar;
  return o}
async function buluta(){
  let o=paket(); if(!o){alert('Kaydedilecek elleme değişikliği yok.');return}
  let m=[]; if(o.elleme_ekle)m.push('🔒 '+o.elleme_ekle.length+' yeni elleme');
  if(o.elleme_cikar)m.push(o.elleme_cikar.length+' elleme kaldırma');
  let fd=new FormData(); fd.append(FORM_ENTRY,JSON.stringify(o));
  try{
    await fetch(FORM_URL,{method:'POST',mode:'no-cors',body:fd});
    alert('☁️ Kaydedildi — '+m.join(', ')+'.\nSistem bir sonraki turda uygulayacak.');
    kilit={}; kaydetYerel(); sayim();
  }catch(e){
    alert('Gönderilemedi — bağlantıyı kontrol edip tekrar dene (işaretlerin bu cihazda saklı, kaybolmaz).')}}
// ---- SIFRE (yalnizca yayin kopyasinda) ----
async function pwAnahtar(p,s){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}
function pwB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function pwDene(p,oto){
  try{
    const key=await pwAnahtar(p,pwB64(ENC.s));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:pwB64(ENC.i)},key,pwB64(ENC.c));
    const o=JSON.parse(new TextDecoder().decode(pt));
    D=o.D; KI=o.K;
    localStorage.setItem('fk_pass',p);
    document.getElementById('pwo').style.display='none';
    render();
  }catch(e){if(!oto)document.getElementById('pwhata').textContent='Şifre yanlış.'}}
function pwBaslat(){
  document.getElementById('pwo').style.display='flex';
  if(!(window.crypto&&crypto.subtle)){document.getElementById('pwhata').textContent='Bu sayfa güvenli bağlantı (https) ister — paylaşılan linki kullan.';return}
  const p=localStorage.getItem('fk_pass'); if(p)pwDene(p,true)}
pwBaslat();
