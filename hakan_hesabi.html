<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hakan Hesabı</title>
<style>
*{box-sizing:border-box}
/* KP jetonlari (panel_uret.py :root); KP gibi koyu ana tema, sistem acik isterse acik */
:root{color-scheme:dark;--plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#8f8d86;--grid:#2c2c2a;--base:#383835;--border:rgba(255,255,255,.10);
 --s1:#3987e5;--good:#3ec93e;--warn:#fab219;--crit:#ff5c5c;--golge:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35)}
@media (prefers-color-scheme:light){:root{color-scheme:light;--plane:#f6f6f4;--surface:#fff;--ink:#16160f;--ink2:#3d3d34;--muted:#6b6b61;--grid:#dcdcd4;--base:#ecece6;--border:rgba(0,0,0,.12);
 --s1:#1f6fd0;--good:#1e8f28;--warn:#b07c00;--crit:#cf2020;--golge:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.10)}}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--plane);color:var(--ink);font-size:14px;line-height:1.4}
main{max-width:1160px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 2px}
.alt{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0;box-shadow:var(--golge);margin:12px 0}
.card h2{font-size:11px;margin:0 0 10px;font-weight:800;color:var(--ink2);letter-spacing:.6px;text-transform:uppercase;display:flex;gap:6px;align-items:center}
.card h2 i{font-style:normal;font-size:14px}.card h2 small{color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.btn{background:var(--s1);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.uyari{background:var(--base);border-left:4px solid var(--warn);padding:8px 10px;border-radius:6px;margin:10px 0;font-size:13px}
.uyari.demo{border-left-color:var(--crit);font-size:14px}
a{color:var(--s1)}
.kasa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.kasa>div{background:var(--base);border-radius:10px;padding:8px 10px;min-width:0}
.kasa small{display:block;color:var(--muted);font-size:11px}
.kasa b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kasa .bak{background:color-mix(in srgb,var(--s1) 16%,transparent);outline:1px solid color-mix(in srgb,var(--s1) 45%,transparent)}
.kasa .bak b{font-size:22px}
.gir{color:var(--good)}.cik{color:var(--crit)}
.tkk{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tkk.yat{color:var(--muted)}.tkk.ytr{color:var(--s1)}
.ytr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ytr input{font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--base);color:var(--ink);min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}td.s,th.s{text-align:right}td.ad{white-space:normal;min-width:160px}
.tw{overflow-x:auto}
#mgovde{background:var(--surface);border-radius:16px;max-width:min(720px,96vw);width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--golge)}
.tkdz{display:none!important}  /* KP "alis duzelt" — bu sayfa salt okuma */
#giris{max-width:320px;margin:20vh auto;text-align:center;padding:0 16px}
#giris input{font:inherit;padding:8px;width:100%;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--base);color:var(--ink)}
#hata{color:var(--crit)}
@media(max-width:760px){.kasa{grid-template-columns:1fr 1fr}main{padding:10px}.card{padding:12px}}

/* #534 siparis takvimi (Net Kar karti yerine) */
.tkbas{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tkbas h2{margin:0;flex-wrap:wrap}
.tkser{flex-wrap:wrap}
.tknav{display:flex;align-items:center;gap:8px;white-space:nowrap}
.tknav .btn{min-width:40px;min-height:36px;font-size:16px;padding:0 8px}
.tknav b{min-width:110px;text-align:center}
.tkoz{display:grid;grid-template-columns:1.6fr 1.3fr 1fr 1fr 1fr;gap:8px;margin:10px 0 6px}
.tkoz>div{background:var(--base);border-radius:10px;padding:8px 10px;min-width:0}
.tkoz small{display:block;color:var(--muted);font-size:11px}
.tkoz b{font-size:15px;font-variant-numeric:tabular-nums}
.tkoz .tknet{background:color-mix(in srgb,var(--good) 14%,transparent);outline:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.tkoz .tknet b{font-size:20px}
.tkoz .tkbek b{color:var(--muted)}
.tkoz .tktah{outline:1px dashed color-mix(in srgb,var(--seq) 55%,transparent)} .tkoz .tktah b{color:var(--seq)}
.tkoz2{font-size:12px;color:var(--ink2);margin:0 2px 12px;font-variant-numeric:tabular-nums}
.tkgv{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.tkt{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.tkgn{color:var(--muted);font-size:11px;text-align:center}
.tkg{background:var(--base);color:var(--ink);font:inherit;text-align:left;border-radius:8px;min-height:70px;padding:6px 6px 12px;border:2px solid transparent;
 cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden}
.tkg.tkbos{background:transparent;cursor:default;opacity:.4;border:1px dashed var(--grid)}
.tkno{font-weight:600;font-size:13px}
.tks{font-size:11px;color:var(--ink2)}
.tktu{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tkg::after{content:"";position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:2px;background:var(--r,transparent)}
.tkyes{--r:var(--good)} .tksar{--r:var(--warn)} .tkgri{--r:var(--muted)}
.tkg.tksec{border-color:var(--s1)}
.tkg.tkbugun .tkno{color:var(--s1)}
.tklej{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--ink2)}
.tklej i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.tkgl h3{margin:0 0 4px;font-size:15px}
.tkalt{color:var(--muted);font-size:12px;margin-bottom:10px}
.tksp{width:100%;background:var(--base);color:var(--ink);font:inherit;text-align:left;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
 display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;border:1px solid transparent}
.tksp:hover{border-color:var(--s1)}
.tkust{font-weight:600;overflow-wrap:anywhere}
.tkkn{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--grid);margin-right:6px;font-weight:600}
.tkrak{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tkkar{grid-row:1/3;grid-column:2;text-align:right;align-self:center;max-width:46%}
.tkkar b{font-size:16px;font-variant-numeric:tabular-nums}
.tkkar.tkyok b{color:var(--muted);font-size:13px}
.tkkar small{display:block;font-size:10.5px;color:var(--muted)}
.tket{display:flex;gap:5px;flex-wrap:wrap;grid-column:1/3;margin-top:4px}
.tke{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.tkok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tkvg{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.tkth{background:color-mix(in srgb,var(--seq) 15%,transparent);color:var(--seq)}
.tkbk{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tkayr{margin-top:12px;border-top:1px solid var(--border);padding-top:6px}
.tkayr>summary{cursor:pointer;font-weight:600;font-size:13px;padding:6px 0}
.tkayr>summary small{font-weight:400;color:var(--muted);font-size:11px}
.tkbl{margin:12px 0}
.tkbl h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px}
.tksat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
.tksat:last-child{border-bottom:0}
.tka{min-width:0;overflow-wrap:anywhere}
.tka small{display:block;color:var(--muted);font-size:11.5px}
.tkv{white-space:nowrap;text-align:right}
.tksat.tktop{font-weight:700;border-top:1px solid var(--border);border-bottom:0}
.tkrz{font-size:10.5px;padding:1px 6px;border-radius:5px;font-weight:600;margin-left:4px;text-transform:none;letter-spacing:0}
.tkdz{margin-top:4px;font-size:12px}
.tkdz summary{cursor:pointer;color:var(--s1);font-size:11.5px}
.tkdz input{width:160px;max-width:100%;margin:4px 6px 0 0}
.tkbilgi{background:var(--base);border-radius:8px;padding:8px 10px;color:var(--ink2);font-size:12.5px}
.tkson{border-radius:12px;padding:14px;text-align:center;margin-top:8px}
.tkson.tkok2{background:color-mix(in srgb,var(--good) 12%,transparent);outline:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.tkson.tkyok2{background:var(--base)}
.tkson.tkth2{background:color-mix(in srgb,var(--seq) 10%,transparent);outline:1px dashed color-mix(in srgb,var(--seq) 50%,transparent)} .tkth2 .tket2{color:var(--seq)}
.tkes{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tkbt{font-size:28px;font-weight:800;margin:2px 0;font-variant-numeric:tabular-nums}
.tkyok2 .tkbt{font-size:19px;color:var(--muted)}
.tket2{font-size:12px;font-weight:700;letter-spacing:.06em}
.tkok2 .tket2{color:var(--good)} .tkyok2 .tket2{color:var(--warn)}
@media(max-width:760px){.tkoz{grid-template-columns:1fr 1fr}.tkoz .tknet{grid-column:1/3}.tkgv{grid-template-columns:1fr}
 .tkg{min-height:60px;padding:4px 3px 11px}.tkg::after{left:3px;right:3px}.tktu,.tks{font-size:10px;white-space:normal;overflow:visible;line-height:1.15}
 .tkbas h2 small{flex-basis:100%}.tksp{grid-template-columns:minmax(0,1fr)}.tkkar{grid-row:auto;grid-column:1;text-align:left;max-width:none}.tket{grid-column:1}
 .tkkar small{display:inline;margin-left:6px}}

/* #564: KP kesitinden sonra (ayni ozgulukte bunlar kazanir) */
.tksp .tkkar{max-width:none;min-width:max-content}
.tkk .kk{display:none}.tkk.bel{color:var(--muted)}
@media(max-width:760px){.tkk{font-size:9.5px;white-space:nowrap;overflow:hidden}.tkk .ku{display:none}.tkk .kk{display:inline}}
</style></head><body>

/* KASA (#536, Hakan 11.10). Tahmin yok:
   Giren   = odeme 'odendi' siparisin yatan tutari, odeme_tarih gununde.
   Yatacak = odeme kaydi var (kesin tutar), para henuz yatmadi; kasaya girmez.

function kasa(V){

  t={ytr:0,cik:0,gir:0,girN:0,yatacak:0,yatN:0,belN:0,kar:0,netN:0,N:S.length};

 const ad={};(V.urunler||[]).forEach(p=>ad[String(p.barkod||'').replace(/^0+/,'')]=p.ad);
 for(const nb in V.alim||{}){const a=V.alim[nb],tu=(+a.alis||0)*(+a.adet||0);t.cik+=tu;G(a.tarih).cik+=tu;al.push({tarih:a.tarih,ad:ad[nb]||a.ad||nb,adet:a.adet,alis:a.alis,tutar:tu,not:a.not,miad:a.miad})}

  if(o.yatti){o.kdur='girdi';o.kgun=o.otar;t.gir+=o.yatan;t.girN++;if(o.otar)G(o.otar).gir+=o.yatan}
  else if(o.sB&&o.otar){o.kdur='yatacak';o.kgun=o.otar;t.yatacak+=o.yatan;t.yatN++;G(o.otar).yat+=o.yatan}

 return {g,t,al};
}

 if(!TK.ay)TK.ay=bug.slice(0,7);TK.ay=TK.ay<aB?aB:TK.ay>aS?aS:TK.ay;
 const M=S.filter(o=>o.tarih.slice(0,7)==TK.ay),kg=t=>KS.g[t],gunler=new Set(M.map(o=>o.tarih).concat(Object.keys(KS.g).filter(t=>t.slice(0,7)==TK.ay)));
 if(!TK.gun||TK.gun.slice(0,7)!=TK.ay){const gl=[...gunler].sort();TK.gun=gunler.has(bug)?bug:gl.filter(t=>t<=bug).pop()||gl[0]||(bug.slice(0,7)==TK.ay?bug:TK.ay+'-01')}
 const n=M.filter(o=>o.kar!=null),yS=M.filter(o=>o.sB);
 const bas=`<div class=tkbas><h2><i>📅</i> Sipariş takvimi <small>${esc(nkBas().split('-').reverse().join('.'))}'dan itibaren · kâr yalnız alış ve yatan belliyse yazılır, tahmin yok</small></h2>
  <div class=tknav><button class=btn${TK.ay<=aB?' disabled':''} onclick="tkAyGit(-1)" aria-label="Önceki ay">‹</button><b>${esc(nkAyAd(TK.ay))}</b><button class=btn${TK.ay>=aS?' disabled':''} onclick="tkAyGit(1)" aria-label="Sonraki ay">›</button></div></div>`;
 const oz=`<div class=tkoz><div class=tknet><small>Kesin net kâr · ${n.length}/${M.length} sipariş</small><b>${tkKr(T(n,'kar'))}</b></div>
  <div class=tkbek><small>Bekleyen · kâr hesaplanamadı</small><b>${M.length-n.length} sip.</b></div>
  <div><small>Toplam satış · ${M.length} sip.</small><b>${tkTl(T(M,'brut'))}</b></div>
  <div><small>Yatan · ödeme kaydı olan ${yS.length} sip.</small><b>${tkTl(T(yS,'yatan'))}</b></div></div>
  ${!M.length&&gunler.size?'<div class=tkoz2>Bu ayda sipariş yok; yalnız kasa hareketleri ve tahmini ödeme günleri var.</div>':''}
  ${n.length?`<div class=tkoz2>Kesin ${n.length} siparişin açılımı: satış ${tkTl(T(n,'brut'))} − gider ${tkTl(T(n,'kesinti')+T(n,'kargo'))} = yatan ${tkTl(T(n,'yatan'))} − alış ${tkTl(T(n,'alis'))} = <b>${tkKr(T(n,'kar'))}</b></div>`:''}`;
 const [y,m]=TK.ay.split('-').map(Number),ilk=(new Date(y,m-1,1).getDay()+6)%7,gs=new Date(y,m,0).getDate();
 /* hucre kasa satiri: genis ekranda tkKt ("188,4 bin"), mobilde kisa ("188k") */
 const kf=v=>`<span class=ku>${tkKt(v)}</span><span class=kk>${v>=1000?Math.round(v/1000)+'k':Math.round(v)}</span>`;
 const kh=k=>k?(k.ytr?`<span class="tkk ytr">◆${kf(k.ytr)}</span>`:'')+(k.gir?`<span class="tkk gir">+${kf(k.gir)}</span>`:'')+(k.cik?`<span class="tkk cik">−${kf(k.cik)}</span>`:'')+(k.yat?`<span class="tkk yat">⏳${kf(k.yat)}</span>`:'')+(k.bel?`<span class="tkk bel" title="ödeme kaydı yok, tahmini gün">~${k.bel} sip.</span>`:''):'';
 let tk=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<div class=tkgn>${x}</div>`).join('')+'<div></div>'.repeat(ilk);
 for(let d=1;d<=gs;d++){const t=TK.ay+'-'+String(d).padStart(2,'0'),L=M.filter(o=>o.tarih==t),k=kg(t),c=(t==bug?' tkbugun':'')+(t==TK.gun?' tksec':'');
  if(!L.length&&!k){tk+=`<div class="tkg tkbos${c}"><span class=tkno>${d}</span></div>`;continue}
  const kk=L.filter(o=>o.kar!=null).length;
  tk+=`<button class="tkg ${!L.length?'':kk==L.length?'tkyes':kk?'tksar':'tkgri'}${c}" onclick="tkGun('${t}')"><span class=tkno>${d}</span>${L.length?`<span class=tks>${L.length} sip.</span><span class=tktu>${tkKt(T(L,'brut'))}</span>`:''}${kh(k)}</button>`}
 const G=M.filter(o=>o.tarih==TK.gun),gn=G.filter(o=>o.kar!=null);
 const kart=o=>`<button class=tksp onclick="tkDetay(${S.indexOf(o)})"><span class=tkust><span class=tkkn>${esc(stKn(o.kanal))}</span>#${esc(o.no)}</span>
   <span class="tkkar${o.kar==null?' tkyok':''}">${o.kar==null?`<b>hesaplanamadı</b><small>${tkNeden(o)}</small>`:`<b>${tkKr(o.kar)}</b><small>net kâr</small>`}</span>
   <span class=tkrak>${o.L.length} ürün · satış ${tkTl(o.brut)} · alış ${o.aB?tkTl(o.alis):'fatura bekleniyor'}</span>
   <span class=tket>${o.aB?'<span class="tke tkok">✓ Alış: belirli</span>':'<span class="tke tkbk">⏳ Alış: belirsiz</span>'}${o.sB?`<span class="tke tkok">✓ Yatan: belirli${o.otar?' · '+(o.yatti?'yattı ':'yatacak ')+tkGa(o.otar):o.yatti?' · yattı':''}</span>`:`<span class="tke tkbk">⏳ Yatan: belirsiz${o.kgun?' · kasaya ~'+tkGa(o.kgun)+' tahmini':''}</span>`}</span></button>`;
 /* gunun kasa hareketi: yatirim, yatan/yatacak siparisler, alimlar, tahmini gunu bu olan belirsizler */
 const H=[],sr=(a,b,v,c)=>H.push(`<div class=tksat><div class=tka>${a}<small>${b}</small></div><div class="tkv ${c}">${v}</div></div>`),k=kg(TK.gun);
 (V.yatirim||[]).filter(x=>x.tarih==TK.gun).forEach(x=>sr('Yatırım',esc(x.not||''),'+ '+tkTl(x.tutar),'gir'));
 S.filter(o=>o.kgun==TK.gun).forEach(o=>o.kdur=='belirsiz'?sr(`${esc(stKn(o.kanal))} #${esc(o.no)}`,`sipariş ${tkGa(o.tarih)} · ödeme kaydı yok · tahmini gün (vade)`,'belirsiz','alt'):
  sr(`${esc(stKn(o.kanal))} #${esc(o.no)}`,`sipariş ${tkGa(o.tarih)} · ${o.kdur=='girdi'?'kasaya girdi':'yatacak, kasada değil'}`,(o.kdur=='girdi'?'+ ':'⏳ ')+tkTl(o.yatan),o.kdur=='girdi'?'gir':'alt'));
 KS.al.filter(a=>a.tarih==TK.gun).forEach(a=>sr('Alım · '+esc(a.ad),`${stSay(a.adet)} adet × ${tkTl(a.alis)}${a.miad?' · miad '+esc(a.miad):''}${a.not?' · '+esc(a.not):''}`,'− '+tkTl(a.tutar),'cik'));
 const gl=`<h3>${esc(TK.gun.split('-').reverse().join('.'))} · ${G.length} sipariş</h3><div class=tkalt>${G.length?`Satış ${tkTl(T(G,'brut'))} · kesin net kâr ${gn.length?tkKr(T(gn,'kar')):'—'} · ${gn.length}/${G.length} sipariş`:'Bu gün sipariş yok.'}</div>`
  +G.map(kart).join('')
  +`<div class=tkbl><h4><span>Kasa hareketi</span>${k?`<span>${k.ytr+k.gir-k.cik?'gün neti '+tkKr(k.ytr+k.gir-k.cik):''}</span>`:''}</h4>${H.join('')||'<div class=tkbilgi>Bu gün kasaya giren/çıkan yok.</div>'}</div>`;
 K.innerHTML=`<div class=card>${bas}${oz}<div class=tkgv><div><div class=tkt>${tk}</div>
  <div class=tklej><span>Hücre: sipariş · satış</span><span><i style="background:var(--good)"></i>kâr kesin</span><span><i style="background:var(--warn)"></i>kısmen eksik</span><span><i style="background:var(--muted)"></i>hesaplanamadı</span>
  <span class=gir>+ kasaya giren</span><span class=cik>− alım</span><span>⏳ yatacak</span><span style="color:var(--s1)">◆ yatırım</span><span>~ tahmini gün (ödeme kaydı yok)</span></div></div>
  <div class=tkgl id=tkGl>${gl}</div></div></div>`;
}

/* Yatirim kaydi: toplayici POST /hakan-yatirim {tarih,tutar,not,kim} -> tum liste (cikti/hakan_yatirim.json). KP srvPost gibi tunel + X-Anahtar. */
async function ytrKaydet(b){
 const f=id=>document.getElementById(id).value.trim(),msg=s=>document.getElementById('yMsg').textContent=s;
 const ta=f('yTa'),tu=Math.round(+f('yTu').replace(',','.')*100)/100;
 if(!/^\d{4}-\d\d-\d\d$/.test(ta)||!(tu>0)||tu>1e8){msg('Tarih ve geçerli tutar yazın');return}
 b.disabled=true;msg('Kaydediliyor…');
 try{const r=await fetch(V.tunel_url.replace(/\/$/,'')+'/hakan-yatirim',{method:'POST',headers:{'X-Anahtar':V.anahtar},body:JSON.stringify({tarih:ta,tutar:tu,not:f('yNo'),kim:'hakan_hesabi'})});
  if(r.status==404)throw Error('uç henüz hazır değil');if(!r.ok)throw Error('sunucu '+r.status);
  const j=await r.json();if(!Array.isArray(j))throw Error('beklenmeyen cevap');V.yatirim=j;ciz();
 }catch(e){msg('Kaydedilmedi: '+e.message);b.disabled=false}
}
async function ac(p){
 try{const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:B(ENC.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(ENC.i)},key,B(ENC.c));
  V=JSON.parse(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  document.getElementById('giris').hidden=true;baslat();
 }catch(e){document.getElementById('hata').textContent='Şifre yanlış'}
}
function baslat(){if(V.demo&&/[?&]demo=1/.test(location.search))V=V.demo;document.getElementById('sayfa').hidden=false;ciz()}
if(V)baslat();else document.getElementById('giris').hidden=false;
</script></body></html>
